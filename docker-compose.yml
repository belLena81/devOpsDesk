services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devopsdesk
      POSTGRES_PASSWORD: devopsdesk
      POSTGRES_DB: devopsdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsdesk"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
